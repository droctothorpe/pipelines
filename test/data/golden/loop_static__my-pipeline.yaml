  workflowMetadata:
    labels:
      pipelines.kubeflow.org/pipeline: pipeline-with-loop-static
      pipelines.kubeflow.org/version: 7664a89e718d
    annotations:
      pipelines.kubeflow.org/storage-state: AVAILABLE
