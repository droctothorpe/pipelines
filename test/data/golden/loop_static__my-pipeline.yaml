apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    pipelines.kubeflow.org/pipeline: pipeline-with-loop-static
    pipelines.kubeflow.org/version: 7664a89e718d
  annotations:
    pipelines.kubeflow.org/display-name: pipeline-with-loop-static
    pipelines.kubeflow.org/description: ''
    pipelines.kubeflow.org/contract: kfp-argo/v1
    pipelines.kubeflow.org/storage-state: AVAILABLE
    pipelines.kubeflow.org/parameter-types: '{"greeting":"String"}'
    pipelines.kubeflow.org/artifact-repository: ''
    pipelines.kubeflow.org/artifact-bucket: ''
    pipelines.kubeflow.org/artifact-key-prefix: ''
    pipelines.kubeflow.org/artifact-root-binding: v1
  name: pipeline-with-loop-static-7664a89e718d
spec:
  entrypoint: t0-root
  serviceAccountName: argo-workflow
  arguments:
    parameters:
    - name: greeting
      value: this is a test for looping through parameters
  templates:
  - name: t0-root
    dag:
      tasks:
      - name: print-op
        template: t5-print-op
        arguments:
          parameters:
          - name: text
            value: '{{inputs.parameters.greeting}}'
      - name: for-loop-2
        template: t2-for-loop-2-fanout
        arguments:
          parameters:
          - name: kfp-items
            value: '["{\"a\": \"1\", \"b\": \"2\"}","{\"a\": \"10\", \"b\": \"20\"}"]'
    inputs:
      parameters:
      - name: greeting
        default: this is a test for looping through parameters
    metadata:
      annotations:
        pipelines.kubeflow.org/input-parameter-types: '{"greeting":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
  - name: t1-for-loop-2
    dag:
      tasks:
      - name: concat-op
        template: t3-concat-op
        arguments:
          parameters:
          - name: a
            value: '{{inputs.parameters.ch-3dc2b37ad4b0df4f}}'
          - name: b
            value: '{{inputs.parameters.ch-2143d98bd2dfe744}}'
      - name: print-op-2
        template: t4-print-op-2
        arguments:
          parameters:
          - name: text
            value: '{{tasks.concat-op.outputs.parameters.Output}}'
        dependencies:
        - concat-op
    inputs:
      parameters:
      - name: ch-3dc2b37ad4b0df4f
      - name: ch-2143d98bd2dfe744
  - name: t2-for-loop-2-fanout
    dag:
      tasks:
      - name: iteration
        template: t1-for-loop-2
        withParam: '{{inputs.parameters.kfp-items}}'
        arguments:
          parameters:
          - name: ch-3dc2b37ad4b0df4f
            value: '{{=type(fromJSON(type(item) == ''string'' ? item : toJson(item))["a"])
              == ''string'' ? fromJSON(type(item) == ''string'' ? item : toJson(item))["a"]
              : toJson(fromJSON(type(item) == ''string'' ? item : toJson(item))["a"])}}'
          - name: ch-2143d98bd2dfe744
            value: '{{=type(fromJSON(type(item) == ''string'' ? item : toJson(item))["b"])
              == ''string'' ? fromJSON(type(item) == ''string'' ? item : toJson(item))["b"]
              : toJson(fromJSON(type(item) == ''string'' ? item : toJson(item))["b"])}}'
    inputs:
      parameters:
      - name: kfp-items
  - name: t3-concat-op
    container:
      image: python:3.11
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps'\
        \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef concat_op(a: str, b: str) -> str:\n    print(a + b)\n    return\
        \ a + b\n\n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{"a":{"optional":false,"type":"String"},"b":{"optional":false,"type":"String"}},"outputDirectory":"/tmp/kfp_outputs","outputs":{"Output":{"path":"/tmp/kfp_outputs/Output","type":"String"}},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '{{inputs.parameters}}'
      - --function_to_execute
      - concat_op
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: a
      - name: b
    outputs:
      parameters:
      - name: Output
        valueFrom:
          path: /tmp/kfp_outputs/Output
      artifacts:
      - name: kfp-metadata
        path: /tmp/kfp_outputs/metadata.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/kfp-metadata.json'
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{"a":"String","b":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{"Output":"String"}'
        pipelines.kubeflow.org/cache-policy: '{"component":"concat-op","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''dcd84cc0301c98810eb0bb63709cf14c1e8f3cbc537531db1543c128596672ef''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''dcd84cc0301c98810eb0bb63709cf14c1e8f3cbc537531db1543c128596672ef''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
  - name: t4-print-op-2
    container:
      image: python:3.11
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps'\
        \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef print_op(text: str) -> str:\n    print(text)\n    return text\n\
        \n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{"text":{"optional":false,"type":"String"}},"outputDirectory":"/tmp/kfp_outputs","outputs":{"Output":{"path":"/tmp/kfp_outputs/Output","type":"String"}},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '{{inputs.parameters}}'
      - --function_to_execute
      - print_op
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: text
    outputs:
      parameters:
      - name: Output
        valueFrom:
          path: /tmp/kfp_outputs/Output
      artifacts:
      - name: kfp-metadata
        path: /tmp/kfp_outputs/metadata.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/kfp-metadata.json'
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{"text":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{"Output":"String"}'
        pipelines.kubeflow.org/cache-policy: '{"component":"print-op","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''d6634888d09d8afbc97d5a793c11f174ac3c853fab48a8eedfbf992c22ec1d76''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''d6634888d09d8afbc97d5a793c11f174ac3c853fab48a8eedfbf992c22ec1d76''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
  - name: t5-print-op
    container:
      image: python:3.11
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps'\
        \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef print_op(text: str) -> str:\n    print(text)\n    return text\n\
        \n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{"text":{"optional":false,"type":"String"}},"outputDirectory":"/tmp/kfp_outputs","outputs":{"Output":{"path":"/tmp/kfp_outputs/Output","type":"String"}},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '{{inputs.parameters}}'
      - --function_to_execute
      - print_op
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: text
    outputs:
      parameters:
      - name: Output
        valueFrom:
          path: /tmp/kfp_outputs/Output
      artifacts:
      - name: kfp-metadata
        path: /tmp/kfp_outputs/metadata.json
        archive:
