        pipelines.kubeflow.org/cache-policy: '{"component":"print-op","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''d6634888d09d8afbc97d5a793c11f174ac3c853fab48a8eedfbf992c22ec1d76''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
