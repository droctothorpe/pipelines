apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    pipelines.kubeflow.org/pipeline: nested-conditions-pipeline
    pipelines.kubeflow.org/version: 579612a172f5
  annotations:
    pipelines.kubeflow.org/display-name: nested-conditions-pipeline
    pipelines.kubeflow.org/description: ''
    pipelines.kubeflow.org/contract: kfp-argo/v1
    pipelines.kubeflow.org/storage-state: AVAILABLE
    pipelines.kubeflow.org/parameter-types: '{}'
    pipelines.kubeflow.org/artifact-repository: ''
    pipelines.kubeflow.org/artifact-bucket: ''
    pipelines.kubeflow.org/artifact-key-prefix: ''
    pipelines.kubeflow.org/artifact-root-binding: v1
  name: nested-conditions-pipeline-579612a172f5
spec:
  entrypoint: t0-root
  serviceAccountName: argo-workflow
  arguments:
    parameters: []
  templates:
  - name: t0-root
    dag:
      tasks:
      - name: flip-coin-op
        template: t7-flip-coin-op
        arguments: {}
      - name: print-op
        template: t8-print-op
        arguments:
          parameters:
          - name: msg
            value: '{{tasks.flip-coin-op.outputs.parameters.Output}}'
        dependencies:
        - flip-coin-op
      - name: flip-coin-op-2
        template: t9-flip-coin-op-2
        arguments: {}
      - name: print-op-2
        template: t10-print-op-2
        arguments:
          parameters:
          - name: msg
            value: '{{tasks.flip-coin-op-2.outputs.parameters.Output}}'
        dependencies:
        - flip-coin-op-2
      - name: condition-1
        template: t1-condition-1
        when: '{{=(tasks["flip-coin-op"].outputs.parameters["Output"] != "no-such-result")}}'
        arguments:
          parameters:
          - name: ch-1e765c5f4481a6ea
            value: '{{tasks.flip-coin-op-2.outputs.parameters.Output}}'
        dependencies:
        - flip-coin-op
        - flip-coin-op-2
    inputs: {}
    metadata:
      annotations:
        pipelines.kubeflow.org/input-parameter-types: '{}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
  - name: t1-condition-1
    dag:
      tasks:
      - name: flip-coin-op-3
        template: t5-flip-coin-op-3
        arguments: {}
      - name: print-op-3
        template: t6-print-op-3
        arguments:
          parameters:
          - name: msg
            value: '{{tasks.flip-coin-op-3.outputs.parameters.Output}}'
        dependencies:
        - flip-coin-op-3
      - name: condition-2
        template: t2-condition-2
        when: '{{=(inputs.parameters["ch-1e765c5f4481a6ea"] == tasks["flip-coin-op-3"].outputs.parameters["Output"])}}'
        arguments: {}
        dependencies:
        - flip-coin-op-3
    inputs:
      parameters:
      - name: ch-1e765c5f4481a6ea
  - name: t2-condition-2
    dag:
      tasks:
      - name: flip-coin-op-4
        template: t3-flip-coin-op-4
        arguments: {}
      - name: print-op-4
        template: t4-print-op-4
        arguments:
          parameters:
          - name: msg
            value: '{{tasks.flip-coin-op-4.outputs.parameters.Output}}'
        dependencies:
        - flip-coin-op-4
    inputs: {}
  - name: t3-flip-coin-op-4
    container:
      image: python:3.11
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps'\
        \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef flip_coin_op() -> str:\n    \"\"\"Flip a coin and output heads\
        \ or tails randomly.\"\"\"\n    import random\n\n    result = 'heads' if random.randint(0,\
        \ 1) == 0 else 'tails'\n    return result\n\n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{},"outputDirectory":"/tmp/kfp_outputs","outputs":{"Output":{"path":"/tmp/kfp_outputs/Output","type":"String"}},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '[]'
      - --function_to_execute
      - flip_coin_op
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    outputs:
      parameters:
      - name: Output
        valueFrom:
          path: /tmp/kfp_outputs/Output
      artifacts:
      - name: kfp-metadata
        path: /tmp/kfp_outputs/metadata.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/kfp-metadata.json'
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{}'
        pipelines.kubeflow.org/output-parameter-types: '{"Output":"String"}'
        pipelines.kubeflow.org/cache-policy: '{"component":"flip-coin-op","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''0fa8cbe2ede98227527e1d5f34e698578a31259e1857d0ebe0e5c314ce26a278''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''0fa8cbe2ede98227527e1d5f34e698578a31259e1857d0ebe0e5c314ce26a278''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
