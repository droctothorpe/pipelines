apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    pipelines.kubeflow.org/pipeline: artifact-previews
    pipelines.kubeflow.org/version: e0fd0cc0c71b
  annotations:
    pipelines.kubeflow.org/display-name: artifact-previews
    pipelines.kubeflow.org/description: Demonstrates previews without a separate preview-generating
      task.
    pipelines.kubeflow.org/contract: kfp-argo/v1
    pipelines.kubeflow.org/storage-state: AVAILABLE
    pipelines.kubeflow.org/parameter-types: '{}'
    pipelines.kubeflow.org/artifact-repository: ''
    pipelines.kubeflow.org/artifact-bucket: ''
    pipelines.kubeflow.org/artifact-key-prefix: ''
    pipelines.kubeflow.org/artifact-root-binding: v1
  name: artifact-previews-e0fd0cc0c71b
spec:
  entrypoint: t0-artifact-previews
  serviceAccountName: argo-workflow
  arguments:
    parameters: []
  templates:
  - name: t0-artifact-previews
    dag:
      tasks:
      - name: create-preview-artifacts
        template: t1-create-preview-artifacts
        arguments:
          parameters:
          - name: seed
            value: '42'
    metadata:
      annotations:
        pipelines.kubeflow.org/input-parameter-types: '{}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
  - name: t1-create-preview-artifacts
    container:
      image: python:3.11
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location --index-url https://pypi.org/simple\
        \ --extra-index-url https://download.pytorch.org/whl/cpu 'pyarrow==23.0.1'\
        \ 'xgboost==3.0.5' 'scikit-learn==1.7.2' 'pandas==3.0.6' 'polars==2.0.0' 'torch==2.14.1+cpu;\
        \ sys_platform == \"linux\"' 'torch==2.14.1; sys_platform != \"linux\"' 'transformers==5.20.0'\
        \  &&  python3 -m pip install --quiet --no-warn-script-location --index-url\
        \ https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu\
        \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
        3.9\"' && \"$0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;import sys,types;_preview=types.ModuleType(''"''"''_kfp_native_artifact_preview''"''"'');sys.modules[_preview.__name__]=_preview;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-preview>''"''"'', ''"''"''exec''"''"''),_preview.__dict__);exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef create_preview_artifacts(\n    dataset: dsl.Output[dsl.Dataset],\n\
        \    model: dsl.Output[dsl.Model],\n    seed: int = 42,\n) -> None:\n    \"\
        \"\"Write native files; the SDK generates their previews by default.\n\n \
        \   Args:\n        dataset: Directory containing data.parquet.\n        model:\
        \ Directory containing model.ubj.\n        seed: Random seed for the synthetic\
        \ data and model.\n    \"\"\"\n    from pathlib import Path\n\n    import\
        \ numpy as np\n    import pyarrow as pa\n    import pyarrow.parquet as pq\n\
        \    import xgboost as xgb\n\n    dataset_directory = Path(dataset.path)\n\
        \    model_directory = Path(model.path)\n    dataset_directory.mkdir(parents=True,\
        \ exist_ok=True)\n    model_directory.mkdir(parents=True, exist_ok=True)\n\
        \n    features = np.random.default_rng(seed).normal(size=(32, 24))\n    labels\
        \ = (features[:, 0] > np.median(features[:, 0])).astype(np.int32)\n    data\
        \ = {\n        f'feature_{index:02d}': features[:, index]\n        for index\
        \ in range(features.shape[1])\n    }\n    data['label'] = labels\n    pq.write_table(pa.table(data),\
        \ dataset_directory / 'data.parquet')\n\n    parameters = {\n        'objective':\
        \ 'binary:logistic',\n        'n_estimators': 5,\n        'max_depth': 2,\n\
        \        'learning_rate': 0.1,\n        'n_jobs': 1,\n        'random_state':\
        \ seed,\n    }\n    estimator = xgb.XGBClassifier(**parameters)\n    estimator.fit(features,\
        \ labels)\n    estimator.save_model(model_directory / 'model.ubj')\n    model.metadata['framework']\
        \ = 'xgboost'\n\n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{"seed":{"optional":true,"type":"Integer"}},"outputDirectory":"/tmp/kfp/outputs","outputs":{"dataset":{"identityPath":"/tmp/kfp/identities/dataset.json","metadataPath":"/tmp/kfp/metadata/dataset.json","metadataUri":"{{workflow.annotations.pipelines.kubeflow.org/artifact-repository}}/{run}/{task}/metadata/dataset.json","path":"/tmp/kfp/outputs/dataset","type":"system.Dataset@0.0.1","uri":"{{workflow.annotations.pipelines.kubeflow.org/artifact-repository}}/{run}/{task}/dataset"},"model":{"identityPath":"/tmp/kfp/identities/model.json","metadataPath":"/tmp/kfp/metadata/model.json","metadataUri":"{{workflow.annotations.pipelines.kubeflow.org/artifact-repository}}/{run}/{task}/metadata/model.json","path":"/tmp/kfp/outputs/model","type":"system.Model@0.0.1","uri":"{{workflow.annotations.pipelines.kubeflow.org/artifact-repository}}/{run}/{task}/model"}},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '{{inputs.parameters}}'
      - --function_to_execute
      - create_preview_artifacts
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: seed
        default: '42'
    outputs:
      parameters:
      - name: kfp-uri-dataset
        value: '{{workflow.annotations.pipelines.kubeflow.org/artifact-repository}}/{{workflow.uid}}/{{pod.name}}/dataset'
      - name: kfp-uri-model
        value: '{{workflow.annotations.pipelines.kubeflow.org/artifact-repository}}/{{workflow.uid}}/{{pod.name}}/model'
      - name: kfp-meta-dataset
        valueFrom:
          path: /tmp/kfp/identities/dataset.json
      - name: kfp-meta-model
        valueFrom:
          path: /tmp/kfp/identities/model.json
      artifacts:
      - name: dataset
        path: /tmp/kfp/outputs/dataset
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/dataset'
      - name: dataset-metadata
        path: /tmp/kfp/metadata/dataset.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/metadata/dataset.json'
      - name: model
        path: /tmp/kfp/outputs/model
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/model'
      - name: model-metadata
        path: /tmp/kfp/metadata/model.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/metadata/model.json'
      - name: kfp-metadata
        path: /tmp/kfp/outputs/metadata.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/kfp-metadata.json'
      - name: dataset-preview
        path: /tmp/kfp/outputs/dataset.kfp-preview.json
        optional: true
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/dataset.kfp-preview.json'
      - name: model-preview
        path: /tmp/kfp/outputs/model.kfp-preview.json
        optional: true
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/model.kfp-preview.json'
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{"seed":"Integer"}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
        pipelines.kubeflow.org/cache-policy: '{"component":"create-preview-artifacts","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''8e3f28995f76a6f970d67c90061765c50126d4ac9662ee36614887a4927e7deb''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''8e3f28995f76a6f970d67c90061765c50126d4ac9662ee36614887a4927e7deb''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
  workflowMetadata:
    labels:
      pipelines.kubeflow.org/pipeline: artifact-previews
      pipelines.kubeflow.org/version: e0fd0cc0c71b
    annotations:
      pipelines.kubeflow.org/storage-state: AVAILABLE
      pipelines.kubeflow.org/artifact-repository: ''
      pipelines.kubeflow.org/artifact-bucket: ''
      pipelines.kubeflow.org/artifact-key-prefix: ''
      pipelines.kubeflow.org/artifact-root-binding: v1
