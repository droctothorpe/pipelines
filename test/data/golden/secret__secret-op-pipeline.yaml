apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    pipelines.kubeflow.org/pipeline: secret-pipeline
    pipelines.kubeflow.org/version: a50dcd23bf3f
  annotations:
    pipelines.kubeflow.org/display-name: secret-pipeline
    pipelines.kubeflow.org/description: A pipeline to demonstrate mounting and use
      of secretes.
    pipelines.kubeflow.org/contract: kfp-argo/v1
    pipelines.kubeflow.org/storage-state: AVAILABLE
    pipelines.kubeflow.org/parameter-types: '{"url":"String"}'
    pipelines.kubeflow.org/artifact-repository: ''
    pipelines.kubeflow.org/artifact-bucket: ''
    pipelines.kubeflow.org/artifact-key-prefix: ''
    pipelines.kubeflow.org/artifact-root-binding: v1
  name: secret-pipeline-a50dcd23bf3f
spec:
  entrypoint: t0-secret-pipeline
  serviceAccountName: argo-workflow
  arguments:
    parameters:
    - name: url
      value: gs://ml-pipeline/sample-data/shakespeare/shakespeare1.txt
  templates:
  - name: t0-secret-pipeline
    dag:
      tasks:
      - name: gcs-list-items
        template: t1-gcs-list-items
        arguments:
          parameters:
          - name: url
            value: '{{inputs.parameters.url}}'
      - name: gcs-list-buckets
        template: t2-gcs-list-buckets
    inputs:
      parameters:
      - name: url
        default: gs://ml-pipeline/sample-data/shakespeare/shakespeare1.txt
    metadata:
      annotations:
        pipelines.kubeflow.org/input-parameter-types: '{"url":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
  - name: t1-gcs-list-items
    container:
      image: google/cloud-sdk:279.0.0
      command:
      - sh
      - -exc
      - "if [ -n \"${GOOGLE_APPLICATION_CREDENTIALS}\" ]; then\n    echo \"Using auth\
        \ token from ${GOOGLE_APPLICATION_CREDENTIALS}\"\n    gcloud auth activate-service-account\
        \ --key-file=\"${GOOGLE_APPLICATION_CREDENTIALS}\"\nfi\ngcloud auth list\n\
        gsutil ls \"$0\"\n"
      - '{{inputs.parameters.url}}'
      env: []
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: url
    outputs:
      parameters:
      - name: kfp-metadata
        value: '{{=toJson({"artifacts":[],"inputs":[],"metrics":{},"producer":{"namespace":workflow.namespace,"run":workflow.uid,"task":pod.name},"schema":"kfp-argo/v1"})}}'
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{"url":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
        pipelines.kubeflow.org/cache-policy: '{"component":"gcs-list-items","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''03f4e7c2e5220bdb4786a991e7f841d918f0126ec97060487988272bcd671a24''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''03f4e7c2e5220bdb4786a991e7f841d918f0126ec97060487988272bcd671a24''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
  - name: t2-gcs-list-buckets
    container:
      image: python:3.7
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-storage==1.31.2'\
        \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
        \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
        $0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef gcs_list_buckets():\n    from google.cloud import storage\n\n \
        \   storage_client = storage.Client()\n    buckets = storage_client.list_buckets()\n\
        \    print('List of buckets:')\n    for bucket in buckets:\n        print(bucket.name)\n\
        \n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{},"outputDirectory":"/tmp/kfp/outputs","outputs":{},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '[]'
      - --function_to_execute
      - gcs_list_buckets
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    outputs:
      artifacts:
      - name: kfp-metadata
        path: /tmp/kfp/outputs/metadata.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/kfp-metadata.json'
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
        pipelines.kubeflow.org/cache-policy: '{"component":"gcs-list-buckets","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''6b87da08b109fb83870c821dd790cf8bde33c3f0582a51523df770d18053092c''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''6b87da08b109fb83870c821dd790cf8bde33c3f0582a51523df770d18053092c''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
  workflowMetadata:
    labels:
      pipelines.kubeflow.org/pipeline: secret-pipeline
      pipelines.kubeflow.org/version: a50dcd23bf3f
    annotations:
      pipelines.kubeflow.org/storage-state: AVAILABLE
      pipelines.kubeflow.org/artifact-repository: ''
      pipelines.kubeflow.org/artifact-bucket: ''
      pipelines.kubeflow.org/artifact-key-prefix: ''
      pipelines.kubeflow.org/artifact-root-binding: v1
