apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    pipelines.kubeflow.org/pipeline: retry-random-failures
    pipelines.kubeflow.org/version: 68024e77f853
  annotations:
    pipelines.kubeflow.org/display-name: retry-random-failures
    pipelines.kubeflow.org/description: The pipeline includes two steps which fail
      randomly. It shows how to use PipelineTask.set_retry(...).
    pipelines.kubeflow.org/contract: kfp-argo/v1
    pipelines.kubeflow.org/storage-state: AVAILABLE
    pipelines.kubeflow.org/parameter-types: '{}'
    pipelines.kubeflow.org/artifact-repository: ''
    pipelines.kubeflow.org/artifact-bucket: ''
    pipelines.kubeflow.org/artifact-key-prefix: ''
    pipelines.kubeflow.org/artifact-root-binding: v1
  name: retry-random-failures-68024e77f853
spec:
  entrypoint: t0-retry-random-failures
  serviceAccountName: argo-workflow
  arguments:
    parameters: []
  templates:
  - name: t0-retry-random-failures
    dag:
      tasks:
      - name: random-failure-op
        template: t1-random-failure-op
        arguments:
          parameters:
          - name: exit_codes
            value: 0,1,2,3
      - name: random-failure-op-2
        template: t2-random-failure-op-2
        arguments:
          parameters:
          - name: exit_codes
            value: 0,1
    metadata:
      annotations:
        pipelines.kubeflow.org/input-parameter-types: '{}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
  - name: t1-random-failure-op
    container:
      image: python:3.11
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps'\
        \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef random_failure_op(exit_codes: str):\n    \"\"\"A component that\
        \ fails randomly.\"\"\"\n    import random\n    import sys\n\n    exit_code\
        \ = int(random.choice(exit_codes.split(',')))\n    print(exit_code)\n    sys.exit(exit_code)\n\
        \n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{"exit_codes":{"optional":false,"type":"String"}},"outputDirectory":"/tmp/kfp/outputs","outputs":{},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '{{inputs.parameters}}'
      - --function_to_execute
      - random_failure_op
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: exit_codes
    outputs:
      artifacts:
      - name: kfp-metadata
        path: /tmp/kfp/outputs/metadata.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/kfp-metadata.json'
    retryStrategy:
      limit: '10'
      retryPolicy: Always
      backoff:
        duration: 0s
        factor: '2'
        maxDuration: 3600s
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{"exit_codes":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
        pipelines.kubeflow.org/cache-policy: '{"component":"random-failure-op","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''0f641a015ccb5ffa0a148a21ae8628faec6989fe6fae51d75ed444166914d3d1''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''0f641a015ccb5ffa0a148a21ae8628faec6989fe6fae51d75ed444166914d3d1''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
  - name: t2-random-failure-op-2
    container:
      image: python:3.11
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps'\
        \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef random_failure_op(exit_codes: str):\n    \"\"\"A component that\
        \ fails randomly.\"\"\"\n    import random\n    import sys\n\n    exit_code\
        \ = int(random.choice(exit_codes.split(',')))\n    print(exit_code)\n    sys.exit(exit_code)\n\
        \n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{"exit_codes":{"optional":false,"type":"String"}},"outputDirectory":"/tmp/kfp/outputs","outputs":{},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '{{inputs.parameters}}'
      - --function_to_execute
      - random_failure_op
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: exit_codes
    outputs:
      artifacts:
      - name: kfp-metadata
        path: /tmp/kfp/outputs/metadata.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/kfp-metadata.json'
    retryStrategy:
      limit: '5'
      retryPolicy: Always
      backoff:
        duration: 0s
        factor: '2'
        maxDuration: 3600s
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{"exit_codes":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
        pipelines.kubeflow.org/cache-policy: '{"component":"random-failure-op","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''9b0c254fd197487f9762ee1162dde3d8f838d05cc0ade146021c47f7ed799b0b''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''9b0c254fd197487f9762ee1162dde3d8f838d05cc0ade146021c47f7ed799b0b''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
  workflowMetadata:
    labels:
      pipelines.kubeflow.org/pipeline: retry-random-failures
      pipelines.kubeflow.org/version: 68024e77f853
    annotations:
      pipelines.kubeflow.org/storage-state: AVAILABLE
      pipelines.kubeflow.org/artifact-repository: ''
      pipelines.kubeflow.org/artifact-bucket: ''
      pipelines.kubeflow.org/artifact-key-prefix: ''
      pipelines.kubeflow.org/artifact-root-binding: v1
