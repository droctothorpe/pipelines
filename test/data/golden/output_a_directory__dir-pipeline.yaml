apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    pipelines.kubeflow.org/pipeline: dir-pipeline
    pipelines.kubeflow.org/version: 90120cdf02a1
  annotations:
    pipelines.kubeflow.org/display-name: dir-pipeline
    pipelines.kubeflow.org/description: ''
    pipelines.kubeflow.org/contract: kfp-argo/v1
    pipelines.kubeflow.org/storage-state: AVAILABLE
    pipelines.kubeflow.org/parameter-types: '{"subdir":"String"}'
    pipelines.kubeflow.org/artifact-repository: ''
    pipelines.kubeflow.org/artifact-bucket: ''
    pipelines.kubeflow.org/artifact-key-prefix: ''
    pipelines.kubeflow.org/artifact-root-binding: v1
  name: dir-pipeline-90120cdf02a1
spec:
  entrypoint: t0-dir-pipeline
  serviceAccountName: argo-workflow
  arguments:
    parameters:
    - name: subdir
      value: texts
  templates:
  - name: t0-dir-pipeline
    dag:
      tasks:
      - name: produce-dir-with-files-python-op
        template: t1-produce-dir-with-files-python-op
        arguments:
          parameters:
          - name: num_files
            value: '15'
          - name: subdir
            value: '{{inputs.parameters.subdir}}'
      - name: list-dir-files-python
        template: t2-list-dir-files-python
        dependencies:
        - produce-dir-with-files-python-op
        arguments:
          parameters:
          - name: kfp-uri-input_dir
            value: '{{tasks.produce-dir-with-files-python-op.outputs.parameters.kfp-uri-output_dir}}'
          - name: kfp-meta-input_dir
            value: '{{tasks.produce-dir-with-files-python-op.outputs.parameters.kfp-meta-output_dir}}'
          - name: subdir
            value: '{{inputs.parameters.subdir}}'
          artifacts:
          - name: input_dir
            from: '{{tasks.produce-dir-with-files-python-op.outputs.artifacts.output_dir}}'
          - name: input_dir-metadata
            from: '{{tasks.produce-dir-with-files-python-op.outputs.artifacts.output_dir-metadata}}'
            optional: true
    inputs:
      parameters:
      - name: subdir
        default: texts
    metadata:
      annotations:
        pipelines.kubeflow.org/input-parameter-types: '{"subdir":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
  - name: t1-produce-dir-with-files-python-op
    container:
      image: python:3.11
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps'\
        \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;import sys,types;_preview=types.ModuleType(''"''"''_kfp_native_artifact_preview''"''"'');sys.modules[_preview.__name__]=_preview;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-preview>''"''"'', ''"''"''exec''"''"''),_preview.__dict__);exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef produce_dir_with_files_python_op(\n    output_dir: Output[Artifact],\
        \ num_files: int = 10, subdir: str = 'texts'\n):\n    import os\n\n    subdir_path\
        \ = os.path.join(output_dir.path, subdir)\n    os.makedirs(subdir_path, exist_ok=True)\n\
        \    for i in range(num_files):\n        file_path = os.path.join(subdir_path,\
        \ str(i) + '.txt')\n        with open(file_path, 'w') as f:\n            f.write(str(i))\n\
        \n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{"num_files":{"optional":true,"type":"Integer"},"subdir":{"optional":true,"type":"String"}},"outputDirectory":"/tmp/kfp/outputs","outputs":{"output_dir":{"identityPath":"/tmp/kfp/identities/output_dir.json","metadataPath":"/tmp/kfp/metadata/output_dir.json","metadataUri":"{{workflow.annotations.pipelines.kubeflow.org/artifact-repository}}/{run}/{task}/metadata/output_dir.json","path":"/tmp/kfp/outputs/output_dir","type":"system.Artifact@0.0.1","uri":"{{workflow.annotations.pipelines.kubeflow.org/artifact-repository}}/{run}/{task}/output_dir"}},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '{{inputs.parameters}}'
      - --function_to_execute
      - produce_dir_with_files_python_op
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: num_files
        default: '10'
      - name: subdir
        default: texts
    outputs:
      parameters:
      - name: kfp-uri-output_dir
        value: '{{workflow.annotations.pipelines.kubeflow.org/artifact-repository}}/{{workflow.uid}}/{{pod.name}}/output_dir'
      - name: kfp-meta-output_dir
        valueFrom:
          path: /tmp/kfp/identities/output_dir.json
      artifacts:
      - name: output_dir
        path: /tmp/kfp/outputs/output_dir
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/output_dir'
      - name: output_dir-metadata
        path: /tmp/kfp/metadata/output_dir.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/metadata/output_dir.json'
      - name: kfp-metadata
        path: /tmp/kfp/outputs/metadata.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/kfp-metadata.json'
      - name: output_dir-preview
        path: /tmp/kfp/outputs/output_dir.kfp-preview.json
        optional: true
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/output_dir.kfp-preview.json'
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{"num_files":"Integer","subdir":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
        pipelines.kubeflow.org/cache-policy: '{"component":"produce-dir-with-files-python-op","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''c396d5e43525a5cbe609ada6ffa426a36ee47c4306ed63f4cc3efabb3b3e0b80''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''c396d5e43525a5cbe609ada6ffa426a36ee47c4306ed63f4cc3efabb3b3e0b80''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
  - name: t2-list-dir-files-python
    container:
      image: python:3.11
      command:
      - sh
      - -c
      - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip || python3\
        \ -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
        \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps'\
        \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\n"
      - sh
      - -ec
      - 'program_path=$(mktemp -d)


        printf "%s" "$0" > "$program_path/ephemeral_component.py"

        _KFP_RUNTIME=true python3 -c ''import base64,zlib,importlib.util;exec(compile(zlib.decompress(base64.b64decode(''"''"''''"''"'')),
        ''"''"''<kfp-native-runtime>''"''"'', ''"''"''exec''"''"''))''                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

        '
      - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
        \ *\n\ndef list_dir_files_python(input_dir: Input[Artifact], subdir: str =\
        \ 'texts'):\n    import os\n\n    dir_items = os.listdir(os.path.join(input_dir.path,\
        \ subdir))\n    for dir_item in dir_items:\n        print(dir_item)\n\n"
      args:
      - --argo_input
      - '{"artifactPreviews":true,"inputs":{"input_dir":{"metadataPath":"/tmp/kfp/inputs/input_dir.json","path":"/tmp/kfp/inputs/input_dir","type":"system.Artifact@0.0.1"},"subdir":{"optional":true,"type":"String"}},"outputDirectory":"/tmp/kfp/outputs","outputs":{},"schema":"kfp-argo/v1"}'
      - --argo_parameters
      - '{{inputs.parameters}}'
      - --function_to_execute
      - list_dir_files_python
      env:
      - name: KFP_ARGO_RUN_UID
        value: '{{workflow.uid}}'
      - name: KFP_ARGO_WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: KFP_ARGO_NODE_ID
        value: '{{pod.name}}'
      - name: KFP_ARGO_NAMESPACE
        value: '{{workflow.namespace}}'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: kfp-uri-input_dir
      - name: kfp-meta-input_dir
      - name: subdir
        default: texts
      artifacts:
      - name: input_dir
        path: /tmp/kfp/inputs/input_dir
      - name: input_dir-metadata
        path: /tmp/kfp/inputs/input_dir.json
        optional: true
    outputs:
      artifacts:
      - name: kfp-metadata
        path: /tmp/kfp/outputs/metadata.json
        archive:
          none: {}
        s3:
          key: '{{workflow.annotations.pipelines.kubeflow.org/artifact-key-prefix}}{{workflow.uid}}/{{pod.name}}/kfp-metadata.json'
    metadata:
      annotations:
        pipelines.kubeflow.org/component-type: RUNTIME
        pipelines.kubeflow.org/input-parameter-types: '{"subdir":"String"}'
        pipelines.kubeflow.org/output-parameter-types: '{}'
        pipelines.kubeflow.org/cache-policy: '{"component":"list-dir-files-python","memoize":{"cache":{"configMap":{"name":"kfp-cache"}},"key":"{{=sprig.sha256sum(''188c588d4ac4619163261b8dd19e0385c8edafa0d18f2235dd00c4c376dbcfb9''
          + toJson(inputs.parameters))}}","maxAge":""}}'
    memoize:
      maxAge: ''
      key: '{{=sprig.sha256sum(''188c588d4ac4619163261b8dd19e0385c8edafa0d18f2235dd00c4c376dbcfb9''
        + toJson(inputs.parameters))}}'
      cache:
        configMap:
          name: kfp-cache
  workflowMetadata:
    labels:
      pipelines.kubeflow.org/pipeline: dir-pipeline
      pipelines.kubeflow.org/version: 90120cdf02a1
    annotations:
      pipelines.kubeflow.org/storage-state: AVAILABLE
      pipelines.kubeflow.org/artifact-repository: ''
      pipelines.kubeflow.org/artifact-bucket: ''
      pipelines.kubeflow.org/artifact-key-prefix: ''
      pipelines.kubeflow.org/artifact-root-binding: v1
